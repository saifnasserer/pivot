flutter_native_splash:
  # Background color
  color: "#ffffff"

  # Image to display (centered)
  image: assets/icon.png

  # Color for dark mode
  color_dark: "#ffffff"
  image_dark: assets/icon.png

  # Android 12+ support
  android_12:
    image: assets/icon.png
    icon_background_color: "#ffffff"
    image_dark: assets/icon.png
    icon_background_color_dark: "#ffffff"

  # Web support
  web: false
