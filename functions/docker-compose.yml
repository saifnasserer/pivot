version: '3.8'

services:
  pivot-functions:
    build: .
    container_name: pivot-functions
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8080
      # Add your Firebase project configuration here
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account-key.json
    volumes:
      # Mount service account key if you have one for local testing
      # - ./service-account-key.json:/app/service-account-key.json:ro
      # Mount source code for development (optional)
      # - .:/app
    restart: unless-stopped
    networks:
      - pivot-network

  # Optional: Add a reverse proxy for multiple functions
  nginx:
    image: nginx:alpine
    container_name: pivot-functions-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pivot-functions
    networks:
      - pivot-network

networks:
  pivot-network:
    driver: bridge

# For production deployment with Firebase CLI
# This compose file is mainly for local testing and development

